<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sterlyn — Admin</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  body{ background:var(--ink); color:var(--bone); }
  .admin-wrap{ max-width:1000px; margin:0 auto; padding:60px var(--pad); }
  .admin-head{ display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:40px; flex-wrap:wrap;}
  .key-box{ display:flex; gap:0; border-bottom:1px solid var(--line-on-ink); max-width:340px; }
  .key-box input{ flex:1; background:none; border:none; outline:none; color:var(--bone); padding:10px 0; font-family:var(--body);}
  .key-box button{ background:none; border:none; color:var(--brass); cursor:pointer; font-family:var(--label); font-size:13px; text-transform:uppercase; padding:10px 4px;}
  table{ width:100%; border-collapse:collapse; margin-top:20px; }
  th, td{ text-align:left; padding:12px 10px; border-bottom:1px solid var(--line-on-ink); font-size:14px; vertical-align:top;}
  th{ font-family:var(--label); font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:rgba(237,232,223,0.55); font-weight:500;}
  .tabs{ display:flex; gap:10px; margin-bottom:10px; }
  .tab-btn{ background:none; border:1px solid var(--line-on-ink); color:var(--bone); padding:8px 16px; cursor:pointer; font-family:var(--label); font-size:13px;}
  .tab-btn.active{ border-color:var(--brass); color:var(--brass); }
  .empty{ color:rgba(237,232,223,0.5); margin-top:30px; }
  .pill{ display:inline-block; font-family:var(--label); font-size:11px; text-transform:uppercase; padding:3px 8px; border:1px solid var(--line-on-ink); border-radius:12px;}
  .inquiry-actions{display:flex;align-items:center;gap:14px;margin-top:20px;}
  .delete-btn{background:var(--sienna);border:1px solid var(--sienna);color:var(--bone);padding:9px 14px;cursor:pointer;font-family:var(--label);font-size:13px;}
  .delete-btn:disabled{opacity:.45;cursor:not-allowed;}
  .select-cell{width:42px;}
  .select-cell input{accent-color:var(--brass);}
  .action-status{color:var(--brass);margin:14px 0 0;}
</style>
</head>
<body>
<div class="admin-wrap">
  <div class="admin-head">
    <div>
      <p class="eyebrow">Sterlyn</p>
      <h2>Studio dashboard</h2>
    </div>
    <div class="key-box">
      <input type="password" id="adminKey" placeholder="Admin key">
      <button id="loadBtn">Unlock →</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="leads">Inquiries</button>
    <button class="tab-btn" data-tab="subs">Newsletter</button>
  </div>

  <div id="content">
    <p class="empty">Enter the admin key to view inquiries and subscribers. This key is set via the <code>ADMIN_KEY</code> environment variable on the server.</p>
  </div>
</div>

<script>
  const keyInput = document.getElementById('adminKey');
  const loadBtn = document.getElementById('loadBtn');
  const content = document.getElementById('content');
  const tabs = document.querySelectorAll('.tab-btn');
  let activeTab = 'leads';
  let cachedKey = '';
  let actionMessage = '';

  tabs.forEach(t => t.addEventListener('click', () => {
    tabs.forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    activeTab = t.dataset.tab;
    if (cachedKey) fetchData();
  }));

  loadBtn.addEventListener('click', () => {
    cachedKey = keyInput.value.trim();
    if (!cachedKey) return;
    fetchData();
  });
  keyInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadBtn.click(); });

  async function fetchData(){
    content.innerHTML = '<p class="empty">Loading…</p>';
    const endpoint = activeTab === 'leads' ? '/api/admin/leads' : '/api/admin/subscribers';
    try {
      const res = await fetch(endpoint, { headers: { 'X-Admin-Key': cachedKey } });
      const json = await res.json();
      if (!res.ok) {
        content.innerHTML = `<p class="empty">${json.error || 'Unauthorized.'}</p>`;
        return;
      }
      render(json.data || []);
    } catch (e) {
      content.innerHTML = '<p class="empty">Network error.</p>';
    }
  }

  function render(rows){
    if (!rows.length){
      content.innerHTML = `${actionMessage ? `<p class="action-status" role="status">${escapeHTML(actionMessage)}</p>` : ''}<p class="empty">Nothing here yet.</p>`;
      return;
    }
    if (activeTab === 'leads'){
      content.innerHTML = `
        <div class="inquiry-actions">
          <button type="button" class="delete-btn" id="deleteSelected" disabled>Delete selected</button>
          <span id="selectedCount" aria-live="polite">0 selected</span>
        </div>
        ${actionMessage ? `<p class="action-status" role="status">${escapeHTML(actionMessage)}</p>` : ''}
        <table>
          <thead><tr><th class="select-cell"><input type="checkbox" id="selectAll" aria-label="Select all inquiries"></th><th>Received</th><th>Name</th><th>Contact</th><th>Project</th><th>Budget</th><th>Message</th></tr></thead>
          <tbody>
            ${rows.map(r => `
              <tr>
                <td class="select-cell"><input type="checkbox" class="inquiry-select" value="${escapeHTML(r.id)}" aria-label="Select inquiry from ${escapeHTML(r.name)}"></td>
                <td>${new Date(r.createdAt).toLocaleString()}</td>
                <td>${escapeHTML(r.name)}</td>
                <td>${escapeHTML(r.email)}<br>${escapeHTML(r.phone||'')}</td>
                <td><span class="pill">${escapeHTML(r.projectType||'—')}</span></td>
                <td>${escapeHTML(r.budget||'—')}</td>
                <td style="max-width:280px;">${escapeHTML(r.message)}</td>
              </tr>`).join('')}
          </tbody>
        </table>
        <p id="deleteStatus" class="action-status" role="status"></p>`;
      const deleteButton = document.getElementById('deleteSelected');
      const selectionCount = document.getElementById('selectedCount');
      const checkboxes = [...content.querySelectorAll('.inquiry-select')];
      const selectAll = document.getElementById('selectAll');
      const updateSelection = () => {
        const selected = checkboxes.filter(box => box.checked).length;
        selectionCount.textContent = `${selected} selected`;
        deleteButton.disabled = selected === 0;
        selectAll.checked = selected === checkboxes.length;
        selectAll.indeterminate = selected > 0 && selected < checkboxes.length;
      };
      checkboxes.forEach(box => box.addEventListener('change', updateSelection));
      selectAll.addEventListener('change', () => {
        checkboxes.forEach(box => { box.checked = selectAll.checked; });
        updateSelection();
      });
      deleteButton.addEventListener('click', deleteSelectedInquiries);
    } else {
      content.innerHTML = `
        <table>
          <thead><tr><th>Subscribed</th><th>Email</th></tr></thead>
          <tbody>
            ${rows.map(r => `<tr><td>${new Date(r.createdAt).toLocaleString()}</td><td>${escapeHTML(r.email)}</td></tr>`).join('')}
          </tbody>
        </table>`;
    }
  }

  async function deleteSelectedInquiries(){
    const ids = [...content.querySelectorAll('.inquiry-select:checked')].map(box => box.value);
    if (!ids.length || !window.confirm(`Delete ${ids.length} selected ${ids.length === 1 ? 'inquiry' : 'inquiries'}? This cannot be undone.`)) return;

    const status = document.getElementById('deleteStatus');
    const button = document.getElementById('deleteSelected');
    button.disabled = true;
    status.textContent = 'Deleting…';
    try {
      const res = await fetch('/api/admin/leads', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Key': cachedKey },
        body: JSON.stringify({ ids })
      });
      const json = await res.json();
      if (!res.ok) {
        status.textContent = json.error || 'Could not delete inquiries.';
        button.disabled = false;
        return;
      }
      actionMessage = `${json.deleted} ${json.deleted === 1 ? 'inquiry' : 'inquiries'} deleted.`;
      await fetchData();
    } catch (e) {
      status.textContent = 'Network error while deleting inquiries.';
      button.disabled = false;
    }
  }

  function escapeHTML(str){
    const d = document.createElement('div');
    d.textContent = str ?? '';
    return d.innerHTML;
  }
</script>
</body>
</html>
